<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RZ7 LIVE TIME</title>
<style>
body{ 
    font-family: 'Segoe UI', Arial; 
    color:#fff; 
    text-align:center; 
    padding:20px; 
    margin:0; 
    min-height: 100vh;
    background: 
        url('team.png'); 
    background-size: contain; 
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-color: #0a0010;
}

h1{ 
    color:#9147ff; 
    text-shadow: 0 0 15px #9147ff; 
    font-size: 2.8em; 
    margin-bottom: 10px; 
    text-align: left;
    padding-left: 20px;
}

.status-box {
    text-align: left;
    padding-left: 20px;
    margin-bottom: 20px;
    font-size: 1.2em;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
}
.status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
}
.live {
    color: #00ff00;
}
.live .status-dot {
    background: #00ff00;
    box-shadow: 0 0 10px #00ff00;
    animation: pulse-dot 1.5s infinite;
}
.not-live {
    color: #ff4444;
}
.not-live .status-dot {
    background: #ff4444;
    box-shadow: 0 0 10px #ff4444;
}

@keyframes pulse-dot{ 
    0% { transform: scale(1); opacity: 1; } 
    50% { transform: scale(1.3); opacity: 0.5; } 
    100% { transform: scale(1); opacity: 1; } 
}

.section-title{ text-align: left; font-size: 1.5em; margin: 30px 20px 15px 20px; font-weight: bold; color:#00ff88; text-shadow: 0 0 10px #00ff88; }
#members{ 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
    gap: 20px; 
    padding: 0 20px; 
    max-width: 1200px;
    margin: 0 auto;
    padding-bottom: 60px; /* Kezhe space */
}
.member-card{ 
    background: rgba(24, 24, 27, 0.85); 
    border-radius: 12px; 
    overflow: hidden; 
    text-align: left; 
    border: 2px solid #00ff88; 
    box-shadow: 0 0 20px #00ff88; 
    backdrop-filter: blur(5px);
    animation: pulse 2s infinite;
    transition: transform 0.3s;
}
.member-card:hover { transform: scale(1.02); }
@keyframes pulse{ 0%,100%{box-shadow: 0 0 20px #00ff88;} 50%{box-shadow: 0 0 35px #00ff88;} }
.thumbnail{ width: 100%; aspect-ratio: 16 / 9; background: #111; position: relative; }
.thumbnail iframe{ width: 100%; height: 100%; border: none; }
.live-badge{ position: absolute; top: 8px; left: 8px; background: red; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index:2; }
.viewer{ position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 4px 8px; border-radius: 4px; font-size: 12px; z-index:2; }
.info{ padding: 12px; }
.info h3{ margin: 0 0 5px 0; font-size: 18px; text-transform: uppercase; }
.info p{ margin: 0 0 8px 0; font-size: 13px; color: #aaa; }
.info a{ color:#9147ff; text-decoration:none; font-size:14px; font-weight:bold; }
.info a:hover{ text-decoration: underline; }
.no-live{ color:#aaa; font-size:1.2em; padding:50px; text-align:center; grid-column: 1 / -1; }
</style>
</head>
<body>

<h1>RZ7 LIVE TIME</h1>

<div id="status-box" class="status-box">
    <span id="status-text">CHECKING...</span>
    <span class="status-dot"></span>
</div>

<div class="section-title">LIVE MEMBERS</div>
<div id="members"><p class="no-live">Checking for live members...</p></div>
    
<script>
const rz7Members = ["mack_gaming", "vegtamyron", "thalapathy-ftw", "nokiya_w","thegod","wipzy_og","jjlit","pranavsettan","rz7-rinu","charanw","rz7-khalid","fatboygaming77"]; 
const membersDiv = document.getElementById('members');
const statusBox = document.getElementById('status-box');
const statusText = document.getElementById('status-text');

async function checkLive() {
    membersDiv.innerHTML = '';
    let liveCount = 0;
    
    for (const username of rz7Members) {
        try {
            const proxyUrl = 'https://api.allorigins.win/get?url=';
            const kickUrl = `https://kick.com/api/v2/channels/${username}`;
            const res = await fetch(proxyUrl + encodeURIComponent(kickUrl));
            const wrapper = await res.json();
            const data = JSON.parse(wrapper.contents);
            
            if(data.livestream){
                liveCount++;
                const cardHTML = `
                <div class="member-card">
                    <div class="thumbnail">
                        <div class="live-badge">LIVE</div>
                        <div class="viewer">${data.livestream.viewer_count} viewers</div>
                        <iframe src="https://player.kick.com/${username}" allowfullscreen></iframe>
                    </div>
                    <div class="info">
                        <h3>${username}</h3>
                        <p>${data.livestream.session_title}</p>
                        <a href="https://kick.com/${username}" target="_blank">Watch on Kick →</a>
                    </div>
                </div>
                `;
                membersDiv.innerHTML += cardHTML;
            }
        } catch (e) {
            console.log(username + " error:", e);
        }
    }
    
    if(liveCount > 0){
        statusText.innerText = "LIVE NOW";
        statusBox.className = "status-box live";
    } else {
        statusText.innerText = "NOT LIVE";
        statusBox.className = "status-box not-live";
        membersDiv.innerHTML = '<p class="no-live">No RZ7 members live right now 😢<br>Check back later!</p>';
    }
}

checkLive();
setInterval(checkLive, 20000);
</script>

</body>
</html>

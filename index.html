body{

/* RED MAATI GREEN NEON AAKKI */
h1{ 
    color:#00ff66; 
    text-shadow: 0 0 15px #00ff66, 0 0 30px #00cc52; 
    font-size: 2.8em; 
    margin-bottom: 20px; 
}

.section-title{ 
    text-align: left; 
    font-size: 1.5em; 
    margin: 30px 20px 15px 20px; 
    font-weight: bold; 
    color:#00ff66; 
    text-shadow: 0 0 10px #00ff66; 
}

#members{ 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
    gap: 20px; 
    padding: 0 20px; 
    max-width: 1200px;
    margin: 0 auto;
}

.member-card{ 
    background: rgba(10, 30, 15, 0.85); 
    border-radius: 12px; 
    overflow: hidden; 
    text-align: left; 
    border: 2px solid #00ff66; 
    box-shadow: 0 0 20px #00ff66; 
    backdrop-filter: blur(5px);
    animation: pulse 2s infinite;
}

@keyframes pulse{ 
    0%,100%{box-shadow: 0 0 20px #00ff66;} 
    50%{box-shadow: 0 0 35px #00cc52;} 
}

.thumbnail iframe{ width: 100%; height: 100%; border: none; }

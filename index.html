<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RZ7 Live Tracker</title>
<style>
body{
    font-family: 'Segoe UI', Arial;
    color:#fff;
    text-align:center;
    padding:20px;
    margin:0;
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #000;
}
h1{
    color:#9147ff;
    text-shadow: 2px 2px 8px black;
    font-size: 2.5em;
    margin-bottom: 20px;
}
.section-title{
    text-align: left;
    font-size: 1.5em;
    margin: 30px 20px 15px 20px;
    font-weight: bold;
}
.section-title span{ color:#00ff88; }

/* GRID LAYOUT - KICK POLE */
#members{ 
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* Mobile il 1, PC il 3-4 */
    gap: 20px;
    padding: 0 20px;
}

.member-card{
    background: rgba(24, 24, 27, 0.9);
    border-radius: 12px;
    overflow: hidden;
    text-align: left;
    transition: 0.2s;
    border: 2px solid transparent;
}
.member-card:hover{
    transform: scale(1.03);
    border-color: #9147ff;
}
.member-card.live{
    border-color: #00ff88;
    box-shadow: 0 0 15px #00ff88;
}

/* THUMBNAIL */
.thumbnail{
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    position: relative;
}
.thumbnail iframe{
    width: 100%;
    height: 100%;
    border: none;
}
.live-badge{
    position: absolute;
    top: 8px;
    left: 8px;
    background: red;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
}
.viewer-badge{
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
}

/* INFO */
.info{
    padding: 12px;
}
.info h3{
    margin: 0 0 5px 0;
    font-size: 16px;
}
.info p{
    margin: 0;
    font-size: 13px;
    color: #aaa;
}
.tags{
    margin-top: 8px;
    display: flex;
    gap: 5px;
}
.tag{
    background: #2d2d30;
    padding: 3px 8px;
    border-radius: 15px;
    font-size: 11px;
}

.rz7-logo{ width: 200px; margin-top: 40px; filter: drop-shadow(0 0 20px #9147ff); }
</style>
</head>
<body>

<h1>RZ7 LIVE TIME</h1>

<div class="section-title"><span>LIVE</span> RZ7 Members</div>
<div id="members"></div>

<img src="https://i.imgur.com/xyz.png" class="rz7-logo" alt="RZ7">

<script>
const rz7Members = ["mack_gaming", "vegtamyron", "thalapathy-ftw", "nokiya_w"]; 
const membersDiv = document.getElementById('members');

async function checkLive() {
    membersDiv.innerHTML = '';
    let allMembers = [];

    for (const username of rz7Members) {
        try {
            const res = await fetch(`https://kick.com/api/v2/channels/${username}`);
            const data = await res.json();
            allMembers.push({username, data});
        } catch (e) {
            allMembers.push({username, data: null});
        }
    }

    // LIVE first, pinne viewer count kurava anusarichu
    allMembers.sort((a, b) => {
        if (a.data?.livestream && !b.data?.livestream) return -1;
        if (!a.data?.livestream && b.data?.livestream) return 1;
        if (a.data?.livestream && b.data?.livestream) {
            return b.data.livestream.viewer_count - a.data.livestream.viewer_count;
        }
        return 0;
    });

    for (const member of allMembers) {
        const username = member.username;
        const data = member.data;
        
        let cardHTML = '';
        let cardClass = 'member-card';
        let thumbHTML = `<div class="thumbnail" style="background:#222; display:flex; align-items:center; justify-content:center;">Offline</div>`;

        if (data?.livestream) {
            cardClass += ' live';
            const viewers = data.livestream.viewer_count;
            const title = data.livestream.session_title || "Live Stream";
            const category = data.livestream.category?.name || "Gaming";
            
            thumbHTML = `
            <div class="thumbnail">
                <iframe src="https://player.kick.com/${username}" allowfullscreen></iframe>
                <div class="live-badge">LIVE</div>
                <div class="viewer-badge">${(viewers/1000).toFixed(1)}K watching</div>
            </div>
            `;

            cardHTML = `
            <div class="${cardClass}">

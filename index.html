<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RZ7 Live Tracker</title>
<style>
body{
    font-family: Arial;
    color:#fff;
    text-align:center;
    padding:20px;
    margin:0;
    background-image: url('bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-color: #000;
}
h1{
    color:#9147ff;
    text-shadow: 2px 2px 8px black;
    font-size: 2.5em;
    margin-bottom: 30px;
}
.member{
    background: rgba(24, 24, 27, 0.85);
    backdrop-filter: blur(8px);
    border: 2px solid #555;
    margin:15px auto;
    padding:20px;
    border-radius:15px;
    width: 90%;
    max-width: 500px;
    transition: 0.3s;
}
.member:hover{ transform: scale(1.02); border-color: #9147ff; }
.live{
    border: 2px solid #00ff88;
    box-shadow: 0 0 20px #00ff88;
    order: -1; /* Live aalukal mela varan */
}
.status-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:8px; }
.offline-dot{ background:#666; }
.live-dot{ background:#00ff88; animation: pulse 1.5s infinite; }
@keyframes pulse{
    0%{box-shadow: 0 0 0 0 rgba(0,255,136,0.7);}
    70%{box-shadow: 0 0 0 10px rgba(0,255,136,0);}
    100%{box-shadow: 0 0 0 0 rgba(0,255,136,0);}
}
a{ color:#9147ff; text-decoration:none; font-weight:bold; font-size:14px; }
a:hover{ text-decoration:underline; }
.player-container{
    width: 100%;
    margin: 15px 0 0 0;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid #00ff88;
    aspect-ratio: 16 / 9;
}
.player-container iframe{ width: 100%; height: 100%; border: none; display: block; }
.rz7-logo{ width: 220px; margin-top: 40px; filter: drop-shadow(0 0 20px #9147ff); }
.viewer-count{ font-size: 13px; color: #aaa; margin-top: 5px; }
#members{ display: flex; flex-direction: column; gap: 15px; } /* Gap set cheyyan */
</style>
</head>
<body>

<h1>RZ7 LIVE TIME</h1>
<div id="members"></div>

<img src="https://i.imgur.com/xyz.png" class="rz7-logo" alt="RZ7">

<script>
const rz7Members = ["mack_gaming", "vegtamyron", "thalapathy-ftw", "nokiya_w"]; 
const membersDiv = document.getElementById('members');

    membersDiv.innerHTML = '';
    let allMembers = [];

    for (const username of rz7Members) {
        try {
            const res = await fetch(`https://kick.com/api/v2/channels/${username}`);
            const data = await res.json();
            allMembers.push({username, data});
        } catch (e) {
            allMembers.push({username, data: null});
        }
    }

    allMembers.sort((a, b) => {
        if (a.data?.livestream && !b.data?.livestream) return -1; // a live aanu
        if (!a.data?.livestream && b.data?.livestream) return 1;  // b live aanu
        return 0; // randum same
    });

        const username = member.username;
        const data = member.data;

        let memberClass = 'member';
        let playerHTML = '';

        if (data?.livestream) {
            memberClass += ' live';
            const viewers = data.livestream.viewer_count;
            statusHTML = `<span class="status-dot live-dot"></span> LIVE NOW`;
            
            playerHTML = `
            <div class="player-container">
                <iframe src="https://player.kick.com/${username}" allowfullscreen frameborder="0"></iframe>
            </div>
            <p class="viewer-count">${viewers} viewers</p>
            `;

            statusHTML = `<span class="status-dot offline-dot"></span> Offline`;

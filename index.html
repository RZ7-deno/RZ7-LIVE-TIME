<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RZ7 LOGIN</title>
<style>
body{ 
    font-family: 'Segoe UI', Arial; 
    color:#fff; 
    margin:0; 
    min-height: 100vh;
    background-image: url('bg.jpg'); /* ninte purple bg.jpg */
    background-size: cover; 
    background-position: center;
    background-attachment: fixed; 
    background-color: #000; 
    display: flex;
    justify-content: center;
    align-items: center;
}

/* SCREENSHOT POLE EXACT BOX */
.login-box{
    background: rgba(10, 10, 10, 0.85);
    padding: 40px 30px;
    border-radius: 15px;
    border: 2px solid #00ff66;
    box-shadow: 0 0 15px #00ff66, 0 0 30px #00ff66;
    width: 90%;
    max-width: 400px;
    text-align: center;
    animation: neonPulse 2s infinite alternate;
}
@keyframes neonPulse{
    from{box-shadow: 0 0 15px #00ff66, 0 0 30px #00ff66;}
    to{box-shadow: 0 0 25px #00ff66, 0 0 50px #00ff66;}
}

.login-box h2{ 
    color:#00ff66; 
    margin-bottom: 30px; 
    font-size: 28px;
    text-shadow: 0 0 10px #00ff66;
}

.login-box input{
    width: 90%;
    padding: 15px;
    margin: 15px 0;
    border: 2px solid #8a00ff; /* Purple border */
    border-radius: 10px;
    background: #000;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}
.login-box input:focus{
    border-color: #00ff66;
    box-shadow: 0 0 15px #00ff66;
}

.login-btn{
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: #00ff66;
    color: #000;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}
.login-btn:hover{ 
    background: #00cc52; 
    box-shadow: 0 0 20px #00ff66;
}

.error{ color: #ff0044; margin-top: 15px; font-weight: bold; }

/* MAIN SITE */
#main-site{ display: none; padding:20px; width:100%; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="login-page">
    <div class="login-box">
        <h2>RZ7 LOGIN 🔐</h2>
        <input type="text" id="login-user" placeholder="Username">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="login-btn" onclick="login()">LOGIN</button>
        <p id="login-error" class="error"></p>
    </div>
</div>

<!-- MAIN SITE -->
<div id="main-site">
<h1 style="text-align:center; color:#00ff66;">RZ7 LIVE TIME</h1>
<p style="text-align:center;">Login Success! Live page ivide add cheyyam</p>
<button onclick="logout()" style="position:fixed; top:20px; right:20px; background:red; color:white; padding:10px; border:none; border-radius:8px;">LOGOUT</button>
</div>

<script>
let users = [{user: "rz7admin", pass: "king@2026"}];

if(localStorage.getItem('rz7_logged_in') === 'true'){
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('main-site').style.display = 'block';
}

function login(){
    const user = document.getElementById('login-user').value;
    const pass = document.getElementById('login-pass').value;
    
    if(users.find(u => u.user === user && u.pass === pass)){
        localStorage.setItem('rz7_logged_in', 'true');
        location.reload();
    } else { 
        document.getElementById('login-error').innerText = "Username or Password thappanu!"; 
    }
}
function logout(){ localStorage.removeItem('rz7_logged_in'); location.reload(); }
</script>

</body>
</html>
